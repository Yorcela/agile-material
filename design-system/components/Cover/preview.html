<!-- @dsCard height=288 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Agile Material</title>
<style>
  html, body { margin:0; height:100%; }
  body { background:var(--surface); color:var(--ink); font-family:var(--font-sans); overflow:hidden; }
  .cover { position:relative; height:288px; overflow:hidden; }
  .art { position:absolute; top:0; left:480px; width:480px; height:288px; overflow:hidden; }
  .art svg { display:block; width:480px; height:288px; overflow:visible; }
  .pine { fill:var(--pine); }
  .sun { fill:var(--sun); }
  .coral { fill:var(--coral); }
  .deep { fill:var(--ink); }
  .ground { fill:var(--surface); }
  .tint { fill:var(--pine-soft); }
  .card { rx:var(--radius-md); }
  .note { rx:var(--radius-sm); }
  .col { rx:var(--radius-lg); }
  .words { position:absolute; left:var(--space-8); bottom:var(--space-8); max-width:440px; }
  .name { margin:0; font-family:var(--font-display, var(--font-sans)); font-size:88px; line-height:.95; font-weight:600; letter-spacing:-.01em; color:var(--ink); }
  .tag { margin:var(--space-3) 0 0 4px; font-size:14px; line-height:20px; color:var(--ink-muted); }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 480 288" width="480" height="288">
<!--
  blocks      pine 144×264 bled off the top (identity, largest) · sun 120×120 (the sticky note) · coral 120×40 (blocked: kept small) · ink 184×208 bleeding off the right edge — ≈35% of 960×288
  arrangement one tall pine slab, a stacked sticky-note pair, a board column; bottoms on one line (y 240), space-4 gutters
  pattern     literal motif, from "a well-organized wall of sticky notes": 9 notes 32×24 in three kanban columns on the ink block (ground cut-outs ×4, sun ×2, pine-soft ×3)
  scales      gutters space-4; note pitch space-8+space-2 across, space-8 down; corners radius-md (slab), radius-sm (notes, sticky note), radius-lg (column)
-->
<rect class="pine card" x="24" y="-24" width="144" height="264" rx="12"/>
<rect class="sun note" x="184" y="64" width="120" height="120" rx="6"/>
<rect class="coral note" x="184" y="200" width="120" height="40" rx="6"/>
<rect class="deep col" x="320" y="32" width="184" height="208" rx="20"/>
<rect class="ground note" x="340" y="56" width="32" height="24" rx="6"/>
<rect class="ground note" x="340" y="88" width="32" height="24" rx="6"/>
<rect class="ground note" x="340" y="120" width="32" height="24" rx="6"/>
<rect class="ground note" x="340" y="152" width="32" height="24" rx="6"/>
<rect class="sun note" x="380" y="56" width="32" height="24" rx="6"/>
<rect class="sun note" x="380" y="88" width="32" height="24" rx="6"/>
<rect class="tint note" x="420" y="56" width="32" height="24" rx="6"/>
<rect class="tint note" x="420" y="88" width="32" height="24" rx="6"/>
<rect class="tint note" x="420" y="120" width="32" height="24" rx="6"/>
</svg>
</div>
<div class="words">
<h1 class="name">Agile Material</h1>
<p class="tag">Warm, readable, consistent team artifacts.</p>
</div>
</div>
</body>
</html>
